// Native SystemHeat / SpaceDust modules → Kerbalism resource routing (Layer B).
// Keeps native C# modules for behaviour and SystemHeat flux; adds *KerbalismUpdater sidecars.

// --- ModuleSystemHeatConverter (non–Kerbalism Chemical Plant parts) ---
@PART[*]:HAS[@MODULE[ModuleSystemHeatConverter]:HAS[#moduleID[*]],!MODULE[ProcessControllerSystemHeat],!MODULE[Configure]:HAS[#title[Chemical?Plant]],!MODULE[SystemHeatConverterKerbalismUpdater]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismNative]:FOR[zzzzzz_KerbalismNative]
{
	MODULE
	{
		name = SystemHeatConverterKerbalismUpdater
		converterModuleID = #$../MODULE[ModuleSystemHeatConverter]:HAS[#moduleID[*]],0/moduleID$
	}

	MODULE
	{
		name = PlannerController
		title = #LOC_KerbalismBridge_Brokers_Converter
		considered = true
	}
}

// --- ModuleSystemHeatHarvester (FFT regolith scoops and other native SH drills) ---
@PART[*]:HAS[@MODULE[ModuleSystemHeatHarvester]:HAS[#moduleID[*]],!MODULE[HarvesterSystemHeat],!MODULE[Configure]:HAS[#title[Drill]],!MODULE[SystemHeatHarvesterKerbalismUpdater]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismNative]:FOR[zzzzzz_KerbalismNative]
{
	MODULE
	{
		name = SystemHeatHarvesterKerbalismUpdater
		harvesterModuleID = #$../MODULE[ModuleSystemHeatHarvester]:HAS[#moduleID[*]],0/moduleID$
	}

	MODULE
	{
		name = PlannerController
		title = #LOC_KerbalismBridge_Brokers_Harvester
		considered = true
	}
}

// --- SpaceDust harvesters (FFT atmosphere / exosphere scoops and SpaceDust parts) ---
@PART[*]:HAS[@MODULE[ModuleSpaceDustHarvester]:HAS[#ModuleID[*]],!MODULE[SpaceDustHarvesterKerbalismUpdater]]:NEEDS[Kerbalism,SystemHeat,SpaceDust,zKerbalismBridge,zKerbalismNative]:FOR[zzzzzz_KerbalismNative]
{
	MODULE
	{
		name = SpaceDustHarvesterKerbalismUpdater
		harvesterModuleID = #$../MODULE[ModuleSpaceDustHarvester]:HAS[#ModuleID[*]],0/ModuleID$
	}

	MODULE
	{
		name = PlannerController
		title = #LOC_SpaceDust_ModuleSpaceDustHarvester_DisplayName
		considered = true
	}
}

// Remove legacy regolith replacement (HarvesterSystemHeat + Kerbalism Configure Drill).
@PART[fft-regolith-scoop-1|fft-regolith-scoop-2]:NEEDS[FarFutureTechnologies,Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismNative]:FINAL
{
	!MODULE[HarvesterSystemHeat],* {}
	!MODULE[Configure]:HAS[#title[Drill]] {}
	!MODULE[Reliability]:HAS[#type[HarvesterSystemHeat]] {}
}
