// Keep native ModuleSystemHeatConverter path; route resources through Kerbalism updater.
@PART[nfe-nuclear-recycler-25-1]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismNative]:BEFORE[NearFutureElectrical]
{
	@MODULE[ModuleResourceConverter],*
	{
		@name = SystemHeatConverterKerbalism
	}
}

@PART[nfe-nuclear-recycler-25-1]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismNative]:BEFORE[SystemHeatConverters]
{
	@MODULE[SystemHeatConverterKerbalism],*
	{
		@name = ModuleResourceConverter
	}

	!MODULE[ProcessController],* {}
	!MODULE[Configure],* {}
	!MODULE[Planner],* {}
	!MODULE[Reliability]:HAS[#type[ProcessController]] {}
}

@PART[nfe-nuclear-recycler-25-1]:HAS[@MODULE[ModuleSystemHeatConverter]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismNative]:FOR[zzzzzz_KerbalismNative]
{
	+MODULE[SystemHeatConverterKerbalismUpdater]
	{
		converterModuleID = #$../MODULE[ModuleSystemHeatConverter]:HAS[#moduleID[*]],0/moduleID$
	}

	+MODULE[PlannerController]
	{
		name = PlannerController
		title = #LOC_KerbalismBridge_Brokers_Converter
		considered = true
	}
}
