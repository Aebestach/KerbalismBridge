// Kerbalism processes for FFT industrial converters (antimatter factory, nuclear smelter).
Profile
{
	name = KerbalismSupport
	modname = Far Future Technologies
	moddir = FarFutureTechnologies

	Process
	{
		name = FFTAntimatterLight
		title = Antimatter Factory (Light Elements)
		modifier = _FFTAMLite
		input = LqdHydrogen@1
		input = ElectricCharge@10000
		output = Antimatter@5
	}

	Process
	{
		name = FFTAntimatterHeavy
		title = Antimatter Factory (Heavy Elements)
		modifier = _FFTAMHeavy
		input = FissionPellets@1
		input = ElectricCharge@10000
		output = Antimatter@500
	}

	Process
	{
		name = FFTNuclearSaltWater
		title = Nuclear Salt Water
		modifier = _FFTNSW
		input = Ore@1
		input = EnrichedUranium@0.005
		input = ElectricCharge@15
		output = NuclearSaltWater@5
	}

	Process
	{
		name = FFTFissionDust
		title = Fission Dust
		modifier = _FFTFissionDust
		input = EnrichedUranium@1
		input = ElectricCharge@150
		output = FissionParticles@10
	}

	Process
	{
		name = FFTFissionPellets
		title = Fission Pellets
		modifier = _FFTFissionPellets
		input = EnrichedUranium@1
		input = ElectricCharge@150
		output = FissionPellets@10
	}
}

RESOURCE_DEFINITION
{
	name = _FFTAMLite
	density = 0.0
	isVisible = false
}
RESOURCE_DEFINITION
{
	name = _FFTAMHeavy
	density = 0.0
	isVisible = false
}
RESOURCE_DEFINITION
{
	name = _FFTNSW
	density = 0.0
	isVisible = false
}
RESOURCE_DEFINITION
{
	name = _FFTFissionDust
	density = 0.0
	isVisible = false
}
RESOURCE_DEFINITION
{
	name = _FFTFissionPellets
	density = 0.0
	isVisible = false
}
