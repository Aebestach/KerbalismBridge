// FFT industrial processors → Kerbalism ProcessController (+ zKerbalismBridge,zKerbalismProcess bridge in ModsSupport/FarFutureTechnologies.cfg).
// Runs BEFORE SystemHeatConverters so genericConverters does not rename ModuleResourceConverter.

@PART[fft-antimatter-factory-1]:NEEDS[Kerbalism,FarFutureTechnologies,zKerbalismFFT,zKerbalismBridge,zKerbalismProcess]:BEFORE[SystemHeatConverters]
{
	!MODULE[ModuleResourceConverter],* {}
	!MODULE[ModuleSystemHeatConverter],* {}
	!MODULE[ModuleCoreHeat] {}
	!MODULE[ModuleOverheatDisplay] {}
	!MODULE[Reliability]:HAS[#type[ModuleResourceConverter]] {}
	!MODULE[PlannerController],* {}

	MODULE
	{
		name = ProcessController
		resource = _FFTAMLite
		title = #LOC_FFT_fft-antimatter-factory-1_lightElements_ConverterName
		capacity = 1
	}
	MODULE
	{
		name = ProcessController
		resource = _FFTAMHeavy
		title = #LOC_FFT_fft-antimatter-factory-1_heavyElements_ConverterName
		capacity = 1
	}

	MODULE
	{
		name = Configure
		title = FFT Industrial Plant
		slots = 2
		SETUP
		{
			name = Light Elements
			desc = #LOC_FFT_fft-antimatter-factory-1_lightElements_ConverterName
			MODULE
			{
				type = ProcessControllerSystemHeat
				id_field = resource
				id_value = _FFTAMLite
			}
		}
		SETUP
		{
			name = Heavy Elements
			desc = #LOC_FFT_fft-antimatter-factory-1_heavyElements_ConverterName
			MODULE
			{
				type = ProcessControllerSystemHeat
				id_field = resource
				id_value = _FFTAMHeavy
			}
		}
	}

	MODULE:NEEDS[FeatureReliability]
	{
		name = Reliability
		type = ProcessControllerSystemHeat
		title = Antimatter Factory
		repair = Engineer,Scientist
		mtbf = 72576000
		extra_cost = 1.0
		extra_mass = 0.2
	}
}

