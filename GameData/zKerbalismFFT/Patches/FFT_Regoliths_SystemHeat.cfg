// FFT regolith scoops -> HarvesterSystemHeat

@PART[fft-regolith-scoop-1]:FINAL:HAS[@MODULE[ModuleSystemHeatHarvester]:HAS[#ResourceName[LqdHe3]]]:NEEDS[FarFutureTechnologies,Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismProcess]
{
    %MODULE[Configure]
    {
        %name = Configure
        %title = Drill
        %slots = 1
        SETUP
        {
            name = LqdHe3 Extraction
            desc = Extract <b>LqdHe3</b> from the surface.
            MODULE
            {
                type = HarvesterSystemHeat
                id_field = resource
                id_value = LqdHe3
            }
            RESOURCE
            {
                name = LqdHe3
                amount = 0
                maxAmount = 50
            }
        }
    }

    +MODULE[ModuleSystemHeatHarvester]:HAS[#ResourceName[LqdHe3]]
    {
        @name = HarvesterSystemHeat
        %title    = LqdHe3 Extraction
        %resource = #$ResourceName$
        %type     = #$HarvesterType$
        %drill    = #$ImpactTransform$
        %length   = #$ImpactRange$

        %min_abundance = 0.02
        %rate          = 0.0025
        @rate *= #$Efficiency$

        %ec_rate = #$INPUT_RESOURCE/Ratio$
        %systemHeatModuleID = harvester
        %GeneratesHeat = false

        !Efficiency      = DELETE
        !ImpactTransform  = DELETE
        !ImpactRange      = DELETE
        !HarvesterType    = DELETE
        !ResourceName     = DELETE
        !ConverterName    = DELETE
        !StartActionName  = DELETE
        !StopActionName   = DELETE
        !ToggleActionName = DELETE
        !INPUT_RESOURCE,* {}
    }

    !MODULE[ModuleSystemHeatHarvester]:HAS[#ResourceName[LqdHe3]] {}
}

