// NFE nuclear recycler -> ProcessControllerSystemHeat

@PART[nfe-nuclear-recycler-25-1]:NEEDS[NearFutureElectrical,Kerbalism,ProfileDefault,zKerbalismBridge]:BEFORE[zzzzzz_KerbalismNative]
{
	!MODULE[ModuleSystemHeatConverter],* {}
	!MODULE[SystemHeatConverterKerbalismUpdater],* {}
}

@PART[nfe-nuclear-recycler-25-1]:HAS[@MODULE[Configure]:HAS[#slots[3]],!MODULE[ModuleSystemHeat]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismProcess,NearFutureElectrical]:FOR[zKerbalismProcess]
{
	MODULE
	{
		name = ModuleSystemHeat
		volume = 5.0
		moduleID = isru
		iconName = Icon_Gears
	}
}

@PART[nfe-nuclear-recycler-25-1]:HAS[@MODULE[Configure]:HAS[#slots[3]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismProcess]:FINAL
{
	!MODULE[ModuleSystemHeatConverter],* {}
	!MODULE[SystemHeatConverterKerbalismUpdater],* {}

	@MODULE[ModuleSystemHeat]:HAS[#moduleID[isru]]
	{
		%volume = 5.0
	}

	@MODULE[ProcessController]:HAS[#resource[_NfeDepletedReprocess]],*
	{
		@name = ProcessControllerSystemHeat
		%systemHeatModuleID = isru
		%shutdownTemperature = 850
		%systemOutletTemperature = 700
		%systemPower = 175
		%AutoShutdown = true
		%GeneratesHeat = false
		!systemEfficiency {}
		systemEfficiency
		{
			key = 0   0.0
			key = 700 1.0
			key = 850 0.0
		}
	}

	@MODULE[ProcessController]:HAS[#resource[_NfeXeExtract]],*
	{
		@name = ProcessControllerSystemHeat
		%systemHeatModuleID = isru
		%shutdownTemperature = 850
		%systemOutletTemperature = 700
		%systemPower = 75
		%AutoShutdown = true
		%GeneratesHeat = false
		!systemEfficiency {}
		systemEfficiency
		{
			key = 0   0.0
			key = 700 1.0
			key = 850 0.0
		}
	}

	@MODULE[ProcessController]:HAS[#resource[_NfeOreRefine]],*
	{
		@name = ProcessControllerSystemHeat
		%systemHeatModuleID = isru
		%shutdownTemperature = 850
		%systemOutletTemperature = 700
		%systemPower = 175
		%AutoShutdown = true
		%GeneratesHeat = false
		!systemEfficiency {}
		systemEfficiency
		{
			key = 0   0.0
			key = 700 1.0
			key = 850 0.0
		}
	}

	@MODULE[Reliability]:HAS[#title[#KERBALISM_NFE_NuclearProcessor_title]]
	{
		@type = ProcessControllerSystemHeat
	}

	@MODULE[Configure]:HAS[#slots[3]]
	{
		@SETUP,*
		{
			@MODULE,*
			{
				@type = ProcessControllerSystemHeat
			}
		}
	}
}
