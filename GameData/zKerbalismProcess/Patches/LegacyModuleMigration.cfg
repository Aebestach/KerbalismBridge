// Legacy KerbalismSystemHeat 0.5.0 module names -> current fork (:FINAL)

// Bridge classes
@PART[*]:HAS[@MODULE[SystemHeatConverterKerbalism]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismProcess]:FINAL
{
	@MODULE[SystemHeatConverterKerbalism],*
	{
		@name = ProcessControllerSystemHeat
	}
}

@PART[*]:HAS[@MODULE[SystemHeatHarvesterKerbalism]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismProcess]:FINAL
{
	@MODULE[SystemHeatHarvesterKerbalism],*
	{
		@name = HarvesterSystemHeat
	}
}

// Legacy harvester without heat loop
@PART[*]:HAS[@MODULE[SystemHeatHarvesterKerbalism],!MODULE[ModuleSystemHeat]]:NEEDS[Kerbalism,SystemHeat]:AFTER[zKerbalismProcess]
{
	MODULE
	{
		name = ModuleSystemHeat
		volume = #$/mass$
		moduleID = harvester
		iconName = Icon_Drill
	}
}

// Third-party renames

@PART[*]:HAS[@MODULE[ThermalPanelFixer]]:NEEDS[Kerbalism,zKerbalismBridge,zKerbalismProcess]:FINAL
{
	@MODULE[ThermalPanelFixer],*
	{
		@name = SolarPanelFixer
	}
}

@PART[*]:HAS[@MODULE[Reliability]:HAS[#type[ThermalPanelFixer]]]:NEEDS[Kerbalism,FeatureReliability,zKerbalismBridge,zKerbalismProcess]:FINAL
{
	@MODULE[Reliability]:HAS[#type[ThermalPanelFixer]]
	{
		@type = SolarPanelFixer
	}
}

// B9PartSwitch IDENTIFIER renames

@PART[*]:HAS[@MODULE[ModuleB9PartSwitch]]:NEEDS[Kerbalism,zKerbalismBridge,zKerbalismProcess,B9PartSwitch]:FINAL
{
	@MODULE[ModuleB9PartSwitch],*
	{
		@SUBTYPE,*
		{
			@MODULE,*
			{
				@IDENTIFIER:HAS[#name[ThermalPanelFixer]]
				{
					@name = SolarPanelFixer
				}
			}
		}
	}
}

@PART[*]:HAS[@MODULE[ModuleB9PartSwitch]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismProcess,B9PartSwitch]:FINAL
{
	@MODULE[ModuleB9PartSwitch],*
	{
		@SUBTYPE,*
		{
			@MODULE,*
			{
				@IDENTIFIER:HAS[#name[SystemHeatConverterKerbalism]]
				{
					@name = ProcessControllerSystemHeat
				}

				@IDENTIFIER:HAS[#name[SystemHeatHarvesterKerbalism]]
				{
					@name = HarvesterSystemHeat
				}
			}
		}
	}
}
