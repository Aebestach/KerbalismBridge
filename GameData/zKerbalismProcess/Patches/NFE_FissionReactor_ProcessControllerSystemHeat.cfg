// nfe-reactor-tiny-1 Size0Radiators is an integrated radiator subtype.
// In stock NFE it sets HeatGeneration to zero on ModuleSystemHeatFissionReactor; Layer A maps that to systemPower.
@PART[nfe-reactor-tiny-1]:HAS[@MODULE[ProcessControllerSystemHeat]:HAS[#resource[_Nukereactor]],@MODULE[ModuleB9PartSwitch]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismProcess,NearFutureElectrical,B9PartSwitch]:FINAL
{
	@MODULE[ModuleB9PartSwitch],*
	{
		@SUBTYPE[Size0Radiators]
		{
			@MODULE,*
			{
				@IDENTIFIER[ProcessControllerSystemHeat]
				{
					%name = ProcessControllerSystemHeat
				}
				@DATA
				{
					%systemPower = 0
					!HeatGeneration,* {}
				}
			}
		}
	}
}
