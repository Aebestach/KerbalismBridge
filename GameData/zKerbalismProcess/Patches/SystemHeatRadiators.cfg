// Stock radiators (exclude HC EBR exchangers)
@PART[!heat-exchanger-125-1,!heat-exchanger-25-1]:HAS[@MODULE[ModuleActiveRadiator]]:NEEDS[Kerbalism,SystemHeat]:FOR[zKerbalismProcess]
{
	@MODULE[ModuleActiveRadiator]:HAS[#maxEnergyTransfer[>0]],*
	{
		@name = SystemHeatRadiatorKerbalism
		%KSH_HeatEmission = #$maxEnergyTransfer$
		@KSH_HeatEmission /= 200
		// SystemHeat operational EC cost: 0.075 EC/s per 150 kW (matches stock SH radiator tuning)
		%KSH_ECRate = #$../KSH_HeatEmission$
		@KSH_ECRate /= 2000
		moduleID = radiator
		systemHeatModuleID = default
		scalarModuleID = heat
		maxTempAnimation = 500

		usePhysicalTemperatureModeling = false
		maxRadiatorTemperature = 350
		emissivity = 0.9

		temperatureCurve
		{
			key = 0 0
			key = #400 $../KSH_HeatEmission$ 0 0
		}
		convectiveArea = #$maxEnergyTransfer$
		@convectiveArea /= 450

		RESOURCE
		{
			name = ElectricCharge
			rate = #$../KSH_ECRate$
		}
	}
	!MODULE[PlannerController],* {}
	MODULE
	{
		name = PlannerController
		title = #LOC_KerbalismBridge_Radiator
		considered = true
	}
}

// SystemHeat radiators
@PART[*]:HAS[@MODULE[ModuleSystemHeatRadiator]]:NEEDS[Kerbalism,SystemHeat]:FOR[zKerbalismProcess]
{
	@MODULE[ModuleSystemHeatRadiator]
	{
		@name = SystemHeatRadiatorKerbalism
	}
	!MODULE[PlannerController],* {}
	MODULE
	{
		name = PlannerController
		title = #LOC_KerbalismBridge_Radiator
		considered = true
	}
}

@PART[*]:HAS[@MODULE[SystemHeatRadiatorKerbalism],!MODULE[ModuleActiveRadiator],@MODULE[Reliability]:HAS[#type[ModuleActiveRadiator]]]:NEEDS[FeatureReliability,SystemHeat]:FOR[zKerbalismProcess]
{
	@MODULE[Reliability]:HAS[#type[ModuleActiveRadiator]]
	{
		@type = SystemHeatRadiatorKerbalism
	}
}
@PART[*]:HAS[@MODULE[SystemHeatRadiatorKerbalism],!MODULE[ModuleSystemHeatRadiator],@MODULE[Reliability]:HAS[#type[ModuleSystemHeatRadiator]]]:NEEDS[FeatureReliability,SystemHeat]:FOR[zKerbalismProcess]
{
	@MODULE[Reliability]:HAS[#type[ModuleSystemHeatRadiator]]
	{
		@type = SystemHeatRadiatorKerbalism
	}
}

// Heat animation
@PART[*]:HAS[@MODULE[SystemHeatRadiatorKerbalism],@MODULE[ModuleAnimateHeat],!MODULE[ModuleSystemHeatColorAnimator]]:NEEDS[Kerbalism,SystemHeat]:FOR[zKerbalismProcess]
{
	!MODULE[ModuleAnimateHeat] {}
	MODULE
	{
		name = ModuleSystemHeatColorAnimator
		moduleID = heat
		useRate = false
		animRate = 1
		shaderProperty = _EmissiveColor
		toggleInEditor = false
		toggleInFlight = false
		redCurve
		{
			key = 0 1
			key = 1 1
		}
		greenCurve
		{
			key = 0 1
			key = 1 1
		}
		blueCurve
		{
			key = 0 1
			key = 1 1
		}
		alphaCurve
		{
			key = 0 0
			key = 1 1
		}
	}
}

// Clean-up
@PART[*]:HAS[@MODULE[SystemHeatRadiatorKerbalism]]:NEEDS[Kerbalism,SystemHeat]:AFTER[zKerbalismProcess]
{
	@MODULE[SystemHeatRadiatorKerbalism],*
	{
		!KSH_HeatEmission = DELETE
	}
}
