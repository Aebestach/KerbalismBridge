// Heat Control radiators: SystemHeat patches + SystemHeatRadiators.cfg + B9PartSwitch_SystemHeatRadiators.cfg.
// HC EBR heat exchangers: ModuleSystemHeatSink (not radiators). Must run after SystemHeatRadiators FOR pass.
@PART[heat-exchanger-125-1]:NEEDS[HeatControl,SystemHeat,Kerbalism,zKerbalismBridge,zKerbalismProcess]:FOR[zzzzzz_KerbalismHeatControl]
{
	@title = #LOC_KerbalismProcess_HC_heat-exchanger-125-1_title
	@description = #LOC_KerbalismProcess_HC_heat-exchanger-125-1_description

	!MODULE[ModuleActiveRadiator],* {}
	!MODULE[ModuleSystemHeatRadiator],* {}
	!MODULE[SystemHeatRadiatorKerbalism],* {}
	!MODULE[PlannerController],* {}
	!MODULE[Reliability]:HAS[#type[ModuleActiveRadiator]] {}
	!MODULE[Reliability]:HAS[#type[SystemHeatRadiatorKerbalism]] {}
	!MODULE[ModuleSystemHeat],* {}
	!MODULE[ModuleSystemHeatSink],* {}

	MODULE
	{
		name = ModuleSystemHeat
		volume = 2
		moduleID = buffer
		iconName = Icon_Snow
	}

	MODULE
	{
		name = ModuleSystemHeatSink
		moduleID = buffer
		systemHeatModuleID = buffer
		// maxEnergyTransfer 12500 W -> 12.5 kW ingest rate
		maxHeatRate = 12.5
		heatStorageDumpRate = 12.5
		heatStorageMaximum = 31500
		heatStorageMass = 200
		heatStorageSpecificHeat = 1.26
	}
}

@PART[heat-exchanger-25-1]:NEEDS[HeatControl,SystemHeat,Kerbalism,zKerbalismBridge,zKerbalismProcess]:FOR[zzzzzz_KerbalismHeatControl]
