@PART[heat-exchanger-125-1]:HAS[@MODULE[ModuleSystemHeatSink],!MODULE[Reliability]:HAS[#type[ModuleSystemHeatSink]]]:NEEDS[HeatControl,SystemHeat,Kerbalism,FeatureReliability,zKerbalismBridge,zKerbalismProcess]:FOR[zzzzzz_KerbalismHeatControl]
{
	MODULE
	{
		name = Reliability
		type = ModuleSystemHeatSink
		title = #LOC_KerbalismProcess_HC_heat_buffer_reliability_title
		redundancy = Heat Storage
		repair = Engineer
		mtbf = 72576000
		extra_cost = 1.0
		extra_mass = 0.25
	}
}

