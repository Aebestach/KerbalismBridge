// Far Future Technologies industrial processors × zKerbalismBridge,zKerbalismProcess 1.0+
// Kerbalism resources via zKerbalismFFT/FFTIndustrialConverters.cfg; heat via ProcessControllerSystemHeat.

@PART[fft-antimatter-factory-1|fft-nuclear-smelter-*]:HAS[@MODULE[ProcessController]|@MODULE[ProcessControllerSystemHeat],!MODULE[ModuleSystemHeat]:HAS[#moduleID[isru]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismProcess,FarFutureTechnologies,zKerbalismFFT]:FOR[zzzzzz_KerbalismProcess]
{
	MODULE
	{
		name = ModuleSystemHeat
		volume = #$/mass$
		moduleID = isru
		iconName = Icon_Gears
	}
}

@PART[fft-antimatter-factory-1]:HAS[@MODULE[ModuleSystemHeat]:HAS[#moduleID[isru]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismProcess,FarFutureTechnologies,zKerbalismFFT]:FOR[zzzzzz_KerbalismProcess]
{
	@MODULE[ModuleSystemHeat]:HAS[#moduleID[isru]]
	{
		@volume = 25
	}
}

@PART[fft-nuclear-smelter-*]:HAS[@MODULE[ModuleSystemHeat]:HAS[#moduleID[isru]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismProcess,FarFutureTechnologies,zKerbalismFFT]:FOR[zzzzzz_KerbalismProcess]
{
	@MODULE[ModuleSystemHeat]:HAS[#moduleID[isru]]
	{
		@volume = 5
	}
}

@PART[fft-antimatter-factory-1|fft-nuclear-smelter-*]:HAS[@MODULE[ProcessController]:HAS[#capacity[*]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismProcess,FarFutureTechnologies,zKerbalismFFT]:FINAL
{
	!MODULE[SystemHeatConverterKerbalism],* {}

	@MODULE[ProcessController]:HAS[#capacity[*]],*
	{
		@name = ProcessControllerSystemHeat
		%systemHeatModuleID = isru
		%AutoShutdown = true
		%GeneratesHeat = false
	}

	@MODULE[Reliability]:HAS[#type[ProcessController]]
	{
		@type = ProcessControllerSystemHeat
	}

	@MODULE[Configure]:HAS[#title[FFT?Industrial?Plant]]
	{
		@SETUP,*
		{
			@MODULE,*
			{
				@type = ProcessControllerSystemHeat
			}
		}
	}
}

// Keep the antimatter processes split: both can run in parallel and Kerbalism reports their heat separately.
@PART[fft-antimatter-factory-1]:HAS[@MODULE[ProcessControllerSystemHeat]:HAS[#resource[_FFTAMLite]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismProcess,FarFutureTechnologies,zKerbalismFFT]:FINAL
{
	@MODULE[ProcessControllerSystemHeat]:HAS[#resource[_FFTAMLite]]
	{
		%shutdownTemperature = 1300
		%systemOutletTemperature = 500
		%systemPower = 9500
		!systemEfficiency {}
		systemEfficiency
		{
			key = 0 0.0
			key = 500 1.0
			key = 700 0.0
		}
	}
}

@PART[fft-antimatter-factory-1]:HAS[@MODULE[ProcessControllerSystemHeat]:HAS[#resource[_FFTAMHeavy]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismProcess,FarFutureTechnologies,zKerbalismFFT]:FINAL
