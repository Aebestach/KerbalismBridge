// KPBS Nuclear Reactor (KKAOSS_Nuclear_Reactor) -> ProcessControllerSystemHeat
// See KerbalismConfig/Support/PlanetaryBaseInc.cfg (merged on feature/systemheat).

@PART[KKAOSS_Nuclear_Reactor]:NEEDS[PlanetaryBaseInc,Kerbalism,ProfileDefault,zKerbalismBridge]:BEFORE[zzzzzz_KerbalismNative]
{
	!MODULE[SystemHeatFissionReactorKerbalismUpdater],* {}
}

@PART[KKAOSS_Nuclear_Reactor]:HAS[@MODULE[ProcessControllerSystemHeat]:HAS[#resource[_Nukereactor]],!MODULE[ModuleSystemHeat]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismProcess,PlanetaryBaseInc,NearFutureElectrical]:AFTER[zzzzzz_KerbalismNative]
{
	MODULE
	{
		name = ModuleSystemHeat
		volume = 1.25
		moduleID = reactor
		iconName = Icon_Nuclear
	}
}

@PART[KKAOSS_Nuclear_Reactor]:HAS[@MODULE[ProcessController]:HAS[#resource[_KPBSNukereactor]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismProcess,PlanetaryBaseInc,NearFutureElectrical,ProfileDefault]:BEFORE[zzzzzz_KerbalismNative]
{
	!MODULE[ModuleSystemHeatFissionReactor],* {}
	!MODULE[ModuleSystemHeatFissionFuelContainer],* {}

	@MODULE[ProcessController]:HAS[#resource[_KPBSNukereactor]]
	{
		@resource = _Nukereactor
		@capacity = 120
		@valve_i = 1
		@name = ProcessControllerSystemHeat
		%systemHeatModuleID = reactor
		%systemOutletTemperature = 850
		%systemPower = 800
		%CurrentPowerPercent = 100
		%MinimumThrottle = 25
		%meltdownTemperature = 1300
		%MaximumTemperature = 2000
		%CoreDamageRate = 0.007
		%CurrentSafetyOverride = 1000
		%allowManualShutdownTemperatureControl = true
		%AutoShutdown = true
		!coreDamageCurve {}
		coreDamageCurve
		{
			key = 1300 0.25
			key = 1650 0.75
			key = 2000 1.0
		}
		!systemEfficiency {}
		systemEfficiency
		{
			key = 0    0.0
			key = 850  1.0
			key = 1300 0.0
		}
	}

	!MODULE[PlannerController],* {}
}

@PART[KKAOSS_Nuclear_Reactor]:HAS[@MODULE[ProcessControllerSystemHeat]:HAS[#resource[_Nukereactor]],!MODULE[Reliability]:HAS[#type[ProcessControllerSystemHeat]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismProcess,PlanetaryBaseInc,NearFutureElectrical,FeatureReliability]:FINAL
{
	!MODULE[Reliability]:HAS[#type[ModuleSystemHeatFissionReactor]],* {}

	MODULE
	{
		name = Reliability
		type = ProcessControllerSystemHeat
		title = Fission Reactor
		redundancy = Power Generation
		repair = Engineer
		mtbf = 66684437
		extra_cost = 2.5
		extra_mass = 1.0
	}
}
