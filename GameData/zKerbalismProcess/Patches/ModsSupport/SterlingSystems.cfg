// Pebble bed reactor — heat power from SystemHeatReactors.cfg
@PART[strl-rctrpb-*]:HAS[@MODULE[ProcessControllerSystemHeat]:HAS[#resource[_PBR]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismProcess,SterlingSystems]:FINAL
{
	@MODULE[ProcessControllerSystemHeat]:HAS[#resource[_PBR]]
	{
		@systemHeatModuleID = nuke
		%shutdownTemperature = 1500
		%systemOutletTemperature = 1300
		%systemPower = 510
		@systemPower *= #$/refPower$
		!systemEfficiency {}
		systemEfficiency
		{
			key = 0 1
			key = 1 1
		}
	}
}

