// Sterling Systems x zKerbalismBridge,zKerbalismProcess 1.0+
// Circular refineries use custom Configure titles (not "Chemical Plant") - handled here.

// --- ModuleSystemHeat loops ---

@PART[strl-isru-circ-fif-*|strl-isru-circ-mmf-*|strl-isru-circ-gcc-*|strl-isru-circ-tif-*|strl-isru-circ-thd-*]:HAS[@MODULE[ProcessController]|@MODULE[ProcessControllerSystemHeat],!MODULE[ModuleSystemHeat]:HAS[#moduleID[isru]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismProcess,SterlingSystems,zKerbalismSterlingSystems]:FOR[zzzzzz_KerbalismProcess]
{
	MODULE
	{
		name = ModuleSystemHeat
		volume = #$/mass$
		moduleID = isru
		iconName = Icon_Gears
	}
}

// MAEC fuel cells: Layer B native converters - ModuleSystemHeat from Sterling SystemHeatConverters.cfg

// strl-rctrms-* already has ModuleSystemHeat (moduleID = nuke) from SterlingSystems/ThermalsPower

// --- ProcessController -> ProcessControllerSystemHeat ---

@PART[strl-isru-circ-fif-*|strl-isru-circ-mmf-*|strl-isru-circ-gcc-*|strl-isru-circ-tif-*|strl-isru-circ-thd-*|strl-rctrms-*|strl-rctrpb-*|strl-rctrkrusty|strl-tectrb-*|strl-preh-*]:HAS[@MODULE[ProcessController]:HAS[#capacity[*]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismProcess,SterlingSystems,zKerbalismSterlingSystems]:FINAL
{
	!MODULE[ModuleSystemHeatConverter],* {}

	@MODULE[ProcessController]:HAS[#capacity[*]],*
	{
		@name = ProcessControllerSystemHeat
		%systemHeatModuleID = isru
		%shutdownTemperature = 800
		%systemOutletTemperature = 600
		%systemPower = #$capacity$
		%AutoShutdown = true
		%GeneratesHeat = false
		!systemEfficiency {}
		systemEfficiency
		{
			key = 0    0.0
			key = 300  1.0
			key = 1000 1.0
			key = 1300 0.0
		}
	}

	@MODULE[Reliability]:HAS[#type[ProcessController]]
	{
		@type = ProcessControllerSystemHeat
	}

	@MODULE[Configure],*
	{
		@SETUP,*
		{
			@MODULE,*
			{
				@type = ProcessControllerSystemHeat
			}
		}
	}
}

// MSR uses nuke loop, not isru
@PART[strl-rctrms-*]:HAS[@MODULE[ProcessControllerSystemHeat]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismProcess,SterlingSystems,zKerbalismSterlingSystems]:FINAL
{
	@MODULE[ProcessControllerSystemHeat],*
	{
		@systemHeatModuleID = nuke
		%shutdownTemperature = 1300
		%systemOutletTemperature = 1100
		!systemEfficiency {}
		systemEfficiency
		{
			key = 0 1
			key = 1 1
		}
	}
}

// Explicit heat power where capacity is not EC (Fission Foundry)
@PART[strl-isru-circ-fif-*]:HAS[@MODULE[ProcessControllerSystemHeat]:HAS[#resource[_FiF]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismProcess,SterlingSystems,zKerbalismSterlingSystems]:FINAL
{
	@MODULE[ProcessControllerSystemHeat]:HAS[#resource[_FiF]]
	{
		%systemPower = 60
		@systemPower *= #$/refPower$
		%shutdownTemperature = 1100
		%systemOutletTemperature = 650
	}
}

