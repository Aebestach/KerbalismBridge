// Radiation fallback for NFE 2.0+ Layer A fission reactors (ProcessControllerSystemHeat path).
// Kerbalism Default NFElectric.cfg normally adds Emitter; this covers load-order gaps.

@PART[nfe-reactor-*]:HAS[@MODULE[ProcessControllerSystemHeat]:HAS[#resource[_Nukereactor]],!MODULE[Emitter]]:NEEDS[NearFutureElectrical,Kerbalism,FeatureRadiation,zKerbalismBridge,zKerbalismProcess]:FOR[zzzzzz_KerbalismProcess]
{
	MODULE
	{
		name = Emitter
		radiation = 0.0003 // rad/s — matches Kerbalism Default NFElectric
	}
}
