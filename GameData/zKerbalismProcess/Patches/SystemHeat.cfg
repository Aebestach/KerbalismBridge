// Add SystemHeat modules for parts, which doesn't have them

// Fission reactors
@PART[*]:HAS[@MODULE[ModuleSystemHeatFissionReactor],!MODULE[ModuleSystemHeat]]:NEEDS[Kerbalism,SystemHeat]:AFTER[zzzzzz_KerbalismNative]
{
	MODULE
	{
		name = ModuleSystemHeat
		volume = 1.0
		moduleID = reactor
		iconName = Icon_Nuclear
	}
}

// Fission engines
@PART[*]:HAS[@MODULE[ModuleSystemHeatFissionEngine],!MODULE[ModuleSystemHeat]]:NEEDS[Kerbalism,SystemHeat]:AFTER[zzzzzz_KerbalismNative]
{
	MODULE
	{
		name = ModuleSystemHeat
		volume = 1.0
		moduleID = reactor
		iconName = Icon_Nuclear
	}
}

// Radiators
@PART[*]:HAS[@MODULE[SystemHeatRadiatorKerbalism],!MODULE[ModuleSystemHeat]]:NEEDS[Kerbalism,SystemHeat]:AFTER[zzzzzz_KerbalismNative]
{
	MODULE
	{
		name = ModuleSystemHeat
		volume = #$/mass$
		moduleID = default
		iconName = Icon_Radiator
		ignoreTemperature = true
	}
}
