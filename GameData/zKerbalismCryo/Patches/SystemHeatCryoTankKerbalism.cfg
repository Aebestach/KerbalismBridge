// SystemHeat cryo tanks
@PART[*]:HAS[@MODULE[ModuleSystemHeatCryoTank],!MODULE[SystemHeatCryoTankKerbalismUpdater]]:NEEDS[Kerbalism,SystemHeat,CryoTanks,zKerbalismCryo]:FOR[zzzzzz_KerbalismCryo]
{
	MODULE
	{
		name = SystemHeatCryoTankKerbalismUpdater
	}
}

@PART[*]:HAS[@MODULE[ModuleSystemHeatCryoTank]:HAS[#moduleID[*]],@MODULE[SystemHeatCryoTankKerbalismUpdater]]:NEEDS[Kerbalism,SystemHeat,CryoTanks,zKerbalismCryo]:AFTER[zzzzzz_KerbalismCryo]
{
	@MODULE[SystemHeatCryoTankKerbalismUpdater]
	{
		%cryoModuleID = #$/MODULE[ModuleSystemHeatCryoTank]:HAS[#moduleID[*]],0/moduleID$
	}
}

