// CryoTanks -> Layer B (EC + background boiloff)
@PART[*]:HAS[@MODULE[ModuleCryoTank],!MODULE[CryoTankKerbalismUpdater]]:NEEDS[Kerbalism,CryoTanks,zKerbalismCryo]:FOR[zzzzzz_KerbalismCryo]
{
	MODULE
	{
		name = CryoTankKerbalismUpdater
	}
}

@PART[*]:HAS[@MODULE[ModuleCryoTank]:HAS[#CoolingCost[>0],#CoolingEnabled[*],~CoolingAllowed[*alse]],!MODULE[PlannerController]]:NEEDS[Kerbalism,CryoTanks]:AFTER[zzzzzz_KerbalismCryo]
{
	MODULE
	{
		name = PlannerController
		title = #KERBALISM_Brokers_Cryotank
		considered = #$/MODULE[ModuleCryoTank]:HAS[#CoolingCost[>0],#CoolingEnabled[*],~CoolingAllowed[*alse],0/CoolingEnabled$
	}
}

@PART[*]:HAS[@MODULE[ModuleCryoTank]:HAS[#CoolingCost[>0],~CoolingEnabled[],~CoolingAllowed[*alse]],!MODULE[PlannerController]]:NEEDS[Kerbalism,CryoTanks]:AFTER[zzzzzz_KerbalismCryo]
{
	MODULE
	{
		name = PlannerController
		title = #KERBALISM_Brokers_Cryotank
		considered = true
	}
}
