// Attach Kerbalism resource integration to all NFE discharge capacitors.
@PART[*]:HAS[@MODULE[DischargeCapacitor],!MODULE[NFECapacitorKerbalismUpdater]]:NEEDS[NearFutureElectrical,Kerbalism,zKerbalismBridge,zKerbalismNative,zKerbalismNFE]:FOR[zKerbalismNFE]
{
	MODULE
	{
		name = NFECapacitorKerbalismUpdater
	}
}
