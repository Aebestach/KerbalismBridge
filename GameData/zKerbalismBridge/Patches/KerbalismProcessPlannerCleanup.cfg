// Remove leftover planner UI after stock module replacement.

@PART[FuelCell|FuelCellArray]:HAS[@MODULE[ProcessController],!MODULE[ModuleResourceConverter]]:NEEDS[Kerbalism,zKerbalismBridge,ProfileDefault]:AFTER[KerbalismDefault]
{
	!MODULE[PlannerController],* {}
	!MODULE[Reliability]:HAS[#type[ModuleResourceConverter]],* {}
}

@PART[strl-worldpower-sth*]:HAS[!MODULE[ModuleResourceConverter]]:NEEDS[Kerbalism,zKerbalismBridge,SterlingSystems]:AFTER[zKerbalismSterlingSystems]
{
	!MODULE[PlannerController]:HAS[#title[converter]],* {}
	!MODULE[Reliability]:HAS[#type[ModuleResourceConverter]],* {}
}

@PART[*]:HAS[@MODULE[ProcessController]|@MODULE[ProcessControllerSystemHeat],!MODULE[ModuleResourceConverter]]:NEEDS[Kerbalism,zKerbalismBridge]:FINAL
{
	!MODULE[PlannerController]:HAS[#title[converter]],* {}
	!MODULE[Reliability]:HAS[#type[ModuleResourceConverter]],* {}
}

@PART[*]:HAS[@MODULE[ProcessController]|@MODULE[ProcessControllerSystemHeat],!MODULE[ModuleGenerator]]:NEEDS[Kerbalism,zKerbalismBridge]:FINAL
{
	!MODULE[PlannerController]:HAS[#title[generator]],* {}
	!MODULE[Reliability]:HAS[#type[ModuleGenerator]],* {}
}
