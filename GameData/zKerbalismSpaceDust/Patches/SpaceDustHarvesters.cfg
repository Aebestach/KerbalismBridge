// SpaceDust harvesters → Kerbalism Layer B (native ModuleSpaceDustHarvester + updater).
@PART[*]:HAS[@MODULE[ModuleSpaceDustHarvester]:HAS[#ModuleID[*]],!MODULE[SpaceDustHarvesterKerbalismUpdater]]:NEEDS[Kerbalism,SystemHeat,SpaceDust,zKerbalismBridge,zKerbalismNative,zKerbalismSpaceDust]:FOR[zzzzzz_KerbalismSpaceDust]
{
	MODULE
	{
		name = SpaceDustHarvesterKerbalismUpdater
		harvesterModuleID = #$../MODULE[ModuleSpaceDustHarvester]:HAS[#ModuleID[*]],0/ModuleID$
	}

	MODULE
	{
		name = PlannerController
		title = #LOC_SpaceDust_ModuleSpaceDustHarvester_DisplayName
		considered = true
	}
}
