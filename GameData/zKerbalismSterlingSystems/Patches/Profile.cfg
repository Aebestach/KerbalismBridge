Profile
{
	name = KerbalismSupport
	modname = Sterling Systems Kerbalism
	moddir = zKerbalismSterlingSystems
	
	Supply
	{
		resource = FissileFuel
		low_message = Fissile Fuel is almost depleted on $VESSEL@<i>Fission reactions will soon be unavailable</i>
		empty_message = There is no more Fissile Fuel on $VESSEL@<i>Fission reactions are no longer available</i>
		refill_message = $VESSEL FissileFuel storage refilled@<i>Fission reactions are available once again</i>
	}
	Supply
	{
		resource = FissilePebbles
		low_message = Fissile Pebbles are almost depleted on $VESSEL@<i>Fission reactions will soon be unavailable</i>
		empty_message = There are no more Fissile Pebbles on $VESSEL@<i>Fission reactions are no longer available</i>
		refill_message = $VESSEL Fissile Pebbles storage refilled@<i>Fission reactions are available once again</i>
	}
	Supply
	{
		resource = FusionPellets
		low_message = Fusion Pellets are almost depleted on $VESSEL@<i>Fusion reactions will soon be unavailable</i>
		empty_message = There are no more Fusion Pellets on $VESSEL@<i>Fusion reactions are no longer available</i>
		refill_message = $VESSEL FusionPellets storage refilled@<i>Fusion reactions are available once again</i>
	}
	Supply
	{
		resource = ThermalPower
		low_message = ThermalPower is almost depleted on $VESSEL@<i>Power generation will soon be unavailable</i>
		empty_message = There is no more ThermalPower on $VESSEL@<i>Power generation is no longer available</i>
		refill_message = $VESSEL ThermalPower storage refilled@<i>Power generation is available once again</i>
	}	

	Process
	{
		name = betavoltaic generator
		title = Betavoltaics
		modifier = _BVG
		input = _BVG@0.0000000005.43384 // Nickel-63; 100 kerbin-year half-life
		output = ElectricCharge@1.0
	}
	Process
	{
		name = FissileFuel
		title = Fissile Fuel
		Tag = SS
		modifier = _FiF
		input = ElectricCharge@60.0
		input = Uraninite@0.072
		input = Minerals@1.04062
		input = ExoticMinerals@0.53468
		input = RareMetals@0.00293
		output = FissileFuel@0.53074 
		output = Aluminium@0.03896
		output = Silicon@0.14474
		output = Oxygen@45.39007
		dump_valve = Aluminium&Silicon,Aluminium&Oxygen,Silicon&Oxygen,Aluminium&Silicon&Oxygen
	}
	Process
	{
		name = RefreshFizzledFuel
		title = Refresh Fizzled Fuel
		tag = SS
		modifier = _RFiF
		input = ElectricCharge@30.0
		input = Uraninite@0.072
		input = FizzledFuel@0.53074
		output = FissileFuel@0.53074
		output = Oxygen@45.39007
		dump_valve = Oxygen
	}
	Process
	{
		name = FissilePebbles
		title = Fissile Pebbles
		tag = SS 
		modifier = _FiP
		input = ElectricCharge@30.0
		input = Uraninite@0.10801
		input = Silicon@0.03618
		input = Carbon@0.01716
		output = FissilePebbles@0.25993
		output = Oxygen@68.08511
		dump_valve = Oxygen
	}
	Process
	{
		name = UraniumRefiner
		title = Uranium Refiner
		tag = SS
		modifier = _UR
		input = ElectricCharge@18.0
		input = Uraninite@0.0015
		output = EnrichedUranium@0.001
	}
	Process
	{
		name = FFTOrionPulse
		title = FFT Orion Pulse Crafting
		Tag = SS
		modifier = _FFTOrionPulse
		input = ElectricCharge@0.0042
		input = Metals@0.0002 // 50% efficient
		input = RareMetals@0.00056 // 50% efficient
		input = Uraninite@0.00028
		output = FissionPulses@0.1
		output = Oxygen@0.13548
		dump_valve = Oxygen
	}
	Process
	{
		name = UraniumSalter
		title = Uranium Salter
		tag = SS
		modifier = _US
		input = EnrichedUranium@0.0002
		input = Water@1.0
		input = ElectricCharge@18.0
		output = NuclearSaltWater@1.0
	}
	Process
	{
		name = RecycleDepletedUranium
		title = Recycle Depleted Uranium
		tag = SS
		modifier = _RDUU
		input = DepletedFuel@0.001
		input = ElectricCharge@18.0
		output = EnrichedUranium@0.0005
		output = XenonGas@0.001
		dump_valve = EnrichedUranium,XenonGas,EnrichedUranium&XenonGas
	}
	Process
	{
		name = SterlingMSR
		title = Sterling Molten Salt Reactor
		tag = SS
		modifier = _MSR
		input = FissileFuel@0.00000988946
		output = FizzledFuel@0.00000988946
		output = ThermalPower@129.935
	}
	Process
	{
		name = SterlingBreederMSR
		title = Sterling Breeder Molten Salt Reactor
		tag = SS
		modifier = _BreederMSR
		input = FissileFuel@0.00000988946
		input = Lithium@0.0000988946
		output = FizzledFuel@0.00000988946
		output = LqdTritium@0.0000988946
		output = ThermalPower@129.935
	}
	Process
	{
		name = SterlingPBR
		title = Sterling Pebble Bed Reactor
		tag = SS
		modifier = _PBR
		input = FissilePebbles@0.0000494473
		output = FizzledPebbles@0.0000494473
		output = ThermalPower@1019.49
	}
	Process
	{
		name = SterlingKLUSTR
		title = Sterling KLUSTR
		tag = SS
		modifier = _KLUSTR
		input = EnrichedUranium@0.000000047681325
		output = DepletedFuel@0.000000047681325
		output = ElectricCharge@13.5
	}
	Process
	{
		name = SterlingMAECAluminiumFuelCell
		title = Sterling Aluminium Fuel Cell
		tag = SS
		modifier = _MAECAlFuelCell
		input = Aluminium@0.3610
		input = Oxidizer@0.0873
		output = Alumina@0.3610
		output = ThermalPower@8
		output = ElectricCharge@16000
		dump_valve = Alumina,ThermalPower,Alumina&ThermalPower
	}
	Process
	{
		name = SterlingMAECSiliconFuelCell
		title = Sterling Silicon Fuel Cell
		tag = SS
		modifier = _MAECSiFuelCell
		input = Silicon@0.4293
		input = Oxidizer@0.0979
		output = LqdQuartz@0.8555
		output = ThermalPower@7.5
		output = ElectricCharge@15000
		dump_valve = LqdQuartz,ThermalPower,LqdQuartz&ThermalPower
	}
	Process
	{
		name = SterlingMAECBerylliumFuelCell
		title = Sterling Beryllium Fuel Cell
		tag = SS
		modifier = _MAECBeFuelCell
		input = Beryllium@1.3319
		input = Oxidizer@0.4559
		output = BerylOxide@1.3319
		output = ThermalPower@12
		output = ElectricCharge@24000
		dump_valve = BerylOxide,ThermalPower,BerylOxide&ThermalPower
	}
	Process
	{
		name = SterlingMAECAluminiumRecharger
		title = Sterling Aluminium Fuel Cell Recharger
		tag = SS
		modifier = _MAECAlRecharger
		input = Alumina@0.27075
		input = ElectricCharge@12000
		output = Aluminium@0.27075
		output = Oxidizer@0.065475
		dump_valve = Aluminium,Oxidizer,Aluminium&Oxidizer
	}
	Process
	{
		name = SterlingMAECSiliconRecharger
		title = Sterling Silicon Fuel Cell Recharger
		tag = SS
		modifier = _MAECSiRecharger
		input = LqdQuartz@0.641625
		input = ElectricCharge@11250
		output = Silicon@0.321975
		output = Oxidizer@0.073425
		dump_valve = Silicon,Oxidizer,Silicon&Oxidizer
	}
	Process
	{
		name = SterlingMAECBerylliumRecharger
		title = Sterling Beryllium Fuel Cell Recharger
		tag = SS
		modifier = _MAECBeRecharger
		input = BerylOxide@0.998925
		input = ElectricCharge@18000
		output = Beryllium@0.998925
		output = Oxidizer@0.341925
		dump_valve = Beryllium,Oxidizer,Beryllium&Oxidizer
	}
	Process
	{
		name = SterlingSULEU
		title = SULEU Fission Reactor
		tag = SS
		modifier = _SULEU
		input = FissilePebbles@0.0000012361825
		output = FizzledPebbles@0.0000012361825
		output = ThermalPower@253.725
	}
	Process
	{
		name = SterlingTEC
		title = Sterling ThermoElectric Converter
		tag = SS
		modifier = _TEC
		input = ThermalPower@2.4
		output = ElectricCharge@1200
	}
	Process
	{
		name = SterlingPreheater
		title = Heating
		tag = SS
		modifier = _Preheater
		input = ThermalPower@1.0
	}
	Process
	{
		name = SterlingConvectorAir
		title = ISRU Convector
		tag = SS
		modifier = _ConvectorAir
		input = IntakeAtm@1.0
	}
	Process
	{
		name = SterlingConvectorWater
		title = ISRU Convector
		tag = SS
		modifier = _ConvectorWater
		input = Water@1.0
	}
	Process
	{
		name = SterlingWindTurbine1
		title = Wind Turbine
		tag = SS
		modifier = _WindTurbine1
		input = IntakeAtm@1.0
		output = ElectricCharge@160
	}
	Process
	{
		name = SterlingWindTurbine2
		title = Wind Turbine
		tag = SS
		modifier = _WindTurbine2
		input = IntakeAtm@1.0
		output = ElectricCharge@480
	}
	Process
	{
		name = SterlingFusionPellets
		title = Fusion Pellets
		tag = SS
		modifier = _FusionPellets
		input = LqdDeuterium@0.1
		input = LqdHe3@0.4
		input = ElectricCharge@50
		output = FusionPellets@0.184375
	}
	
	//Sterling Molten Metal Foundry		
	// - MineralsSplitter
	// - ExoticMineralsSplitter

	// - Sterling General Chemistry Center
	Process
	{
		name = true sabatier process   
		title = True Sabatier Process
		Tag = SS
		modifier = _TrueSabatierProcess
		input = ElectricCharge@0.008082126 
		input = CarbonDioxide@3.490273221
		input = Hydrogen@13.87826691
		output = Water@0.005574954
		output = Methane@3.46196019	
		dump_valve = Water,Methane
	}	
	Process
	{
		name = MakeKonkrete
		title = Make Konkrete
		tag = SS
		modifier = _MakeKonkrete
		input = ElectricCharge@30
		input = Water@0.50
		input = Minerals@0.10
		output = Konkrete@0.25
	}	
	Process
	{
		name = RockMelter
		title = Rock Melter
		tag = SS
		modifier = _RockMelter
		input = ElectricCharge@100
		input = Rock@0.50
		output = Konkrete@0.25
	}
	Process
	{
		name = OPALProcessor
		title = OPAL Processor
		tag = SS
		modifier = _OPALProcessor
		input = ElectricCharge@15
		input = Ore@0.0014
		output = Water@0.00036
	}	
	Process
	{
		name = CoolantProcessor
		title = Coolant Processor
		tag = SS
		modifier = _CoolantProcessor
		input = ElectricCharge@30
		input = Water@1.0
		input = Ore@5.0
		input = Minerals@3.0 
		output = Coolant@0.21
	}		
}

