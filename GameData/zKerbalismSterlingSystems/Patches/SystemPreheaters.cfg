// Sterling Preheaters -> Kerbalism ProcessController + SystemHeat (Layer A).
// ProcessControllerSystemHeat fields are finalized in zKerbalismProcess/Patches/ModsSupport/SterlingSystems.cfg.

@PART[strl-preh-*]:NEEDS[CommunityResourcePack,Kerbalism,SystemHeat,SterlingSystems,zKerbalismBridge,zKerbalismProcess]:FOR[zKerbalismSterlingSystems]
{
	@tags ^= :$: _kerbalism

	!MODULE[ModuleSystemHeatConverter],* {}
	!MODULE[ModuleResourceConverter],* {}
	!MODULE[SystemHeatConverterKerbalism],* {}
	!MODULE[SystemHeatConverterKerbalismUpdater],* {}
	!MODULE[PlannerController],* {}
	!MODULE[ModuleOverheatDisplay] {}
	!MODULE[ModuleCoreHeat] {}

	MODULE
	{
		name = ProcessController
		resource = _Preheater
		title = Heating
		capacity = #$/refPower$
	}
}

// B9 temperature subtypes tweak outlet/shutdown on the heat converter module.
// ModuleAnimationGroup matches IAnimatedModule via GetModuleDisplayName() == moduleType (Sterling: Preheater).
@PART[strl-preh-*]:HAS[@MODULE[ProcessControllerSystemHeat]:HAS[#resource[_Preheater]]]:NEEDS[CommunityResourcePack,Kerbalism,SystemHeat,SterlingSystems,zKerbalismBridge,zKerbalismProcess]:FINAL
{
	@MODULE[ProcessControllerSystemHeat]:HAS[#resource[_Preheater]]
	{
		%deployModuleType = Preheater
	}
}

@PART[strl-preh-*]:HAS[@MODULE[ProcessControllerSystemHeat]:HAS[#resource[_Preheater]],@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[shutdownTemperature]]]:NEEDS[CommunityResourcePack,B9PartSwitch,Kerbalism,SystemHeat,SterlingSystems,zKerbalismBridge,zKerbalismProcess]:FINAL
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[shutdownTemperature]]
	{
		@SUBTYPE,*
		{
			@MODULE,*
			{
				@IDENTIFIER[ModuleSystemHeatConverter]
				{
					@name = ProcessControllerSystemHeat
				}
			}
		}
	}
}
