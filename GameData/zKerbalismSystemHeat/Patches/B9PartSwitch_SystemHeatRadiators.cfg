// Keep B9PartSwitch subtype module identifiers in sync after radiators are renamed to SystemHeatRadiatorKerbalism.
@PART[*]:HAS[@MODULE[SystemHeatRadiatorKerbalism],@MODULE[ModuleB9PartSwitch]]:NEEDS[Kerbalism,SystemHeat,B9PartSwitch]:AFTER[zzzzzz_KerbalismSystemHeat]
{
	@MODULE[ModuleB9PartSwitch],*
	{
		@SUBTYPE,*
		{
			@MODULE,*
			{
				@IDENTIFIER[ModuleSystemHeatRadiator]
				{
					@name = SystemHeatRadiatorKerbalism
				}
				@IDENTIFIER[ModuleActiveRadiator]
				{
					@name = SystemHeatRadiatorKerbalism
				}
			}
		}
	}
}
