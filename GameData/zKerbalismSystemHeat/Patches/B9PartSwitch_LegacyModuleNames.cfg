// Migration for third-party MM patches that still reference module classes removed in this fork.
// Maps legacy names on the part and in B9PartSwitch subtype IDENTIFIER blocks only when those
// legacy modules are still present after all other patches — native ModuleSystemHeatConverter
// / ModuleSystemHeatHarvester parts are not touched.
//
// Does NOT rename ModuleSystemHeatConverter -> SystemHeatConverterKerbalism (that class no longer exists).

@PART[*]:HAS[@MODULE[ThermalPanelFixer]]:NEEDS[Kerbalism,zKerbalismSystemHeat]:FINAL
{
	@MODULE[ThermalPanelFixer],*
	{
		@name = SolarPanelFixer
	}
}

@PART[*]:HAS[@MODULE[Reliability]:HAS[#type[ThermalPanelFixer]]]:NEEDS[Kerbalism,FeatureReliability,zKerbalismSystemHeat]:FINAL
{
	@MODULE[Reliability]:HAS[#type[ThermalPanelFixer]]
	{
		@type = SolarPanelFixer
	}
}

@PART[*]:HAS[@MODULE[SystemHeatConverterKerbalism]]:NEEDS[Kerbalism,SystemHeat,zKerbalismSystemHeat]:FINAL
{
	@MODULE[SystemHeatConverterKerbalism],*
	{
		@name = ProcessControllerSystemHeat
	}
}

@PART[*]:HAS[@MODULE[SystemHeatHarvesterKerbalism]]:NEEDS[Kerbalism,SystemHeat,zKerbalismSystemHeat]:FINAL
{
	@MODULE[SystemHeatHarvesterKerbalism],*
	{
		@name = HarvesterSystemHeat
	}
}

@PART[*]:HAS[@MODULE[ModuleB9PartSwitch]]:NEEDS[Kerbalism,zKerbalismSystemHeat,B9PartSwitch]:FINAL
{
	@MODULE[ModuleB9PartSwitch],*
	{
		@SUBTYPE,*
		{
			@MODULE,*
			{
				@IDENTIFIER:HAS[#name[ThermalPanelFixer]]
				{
					@name = SolarPanelFixer
				}
			}
		}
	}
}

@PART[*]:HAS[@MODULE[ModuleB9PartSwitch]]:NEEDS[Kerbalism,SystemHeat,zKerbalismSystemHeat,B9PartSwitch]:FINAL
{
	@MODULE[ModuleB9PartSwitch],*
	{
		@SUBTYPE,*
		{
			@MODULE,*
			{
				@IDENTIFIER:HAS[#name[SystemHeatConverterKerbalism]]
				{
					@name = ProcessControllerSystemHeat
				}

				@IDENTIFIER:HAS[#name[SystemHeatHarvesterKerbalism]]
				{
					@name = HarvesterSystemHeat
				}
			}
		}
	}
}
