// Do not let Kerbalism touch NFE Nuclear Recycler
@PART[nfe-nuclear-recycler-25-1]:NEEDS[Kerbalism,SystemHeatConverters]:BEFORE[NearFutureElectrical]
{
	@MODULE[ModuleResourceConverter],*
	{
		@name = SystemHeatConverterKerbalism
	}
}
@PART[nfe-nuclear-recycler-25-1]:NEEDS[Kerbalism,SystemHeatConverters]:BEFORE[SystemHeatConverters]
{
	@MODULE[SystemHeatConverterKerbalism],*
	{
		@name = ModuleResourceConverter
	}

	!MODULE[ProcessController],* {}
	!MODULE[Configure],* {}
	!MODULE[Planner],* {}

	!MODULE[Reliability]:HAS[#type[ProcessController]] {}
}
