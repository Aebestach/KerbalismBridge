// Dynamic radiation for FFT fusion reactors
@PART[*]:HAS[@MODULE[FFTFusionReactorKerbalismUpdater]]:NEEDS[Kerbalism,FeatureRadiation,zKerbalismFFT,FarFutureTechnologies]:FOR[zzzzzzz_KerbalismDynamicRadiation]
{
	MODULE
	{
		name = DynamicRadiationController
		powerModuleName = FusionReactor
		powerModuleId = #$/MODULE[FFTFusionReactorKerbalismUpdater]/reactorModuleID$
		minEmissionPercent = #$@KERBALISM_DYNAMIC_RADIATION_SETTINGS/Reactor_MinEmissionPercent$
		emissionDecayRate = #$@KERBALISM_DYNAMIC_RADIATION_SETTINGS/Reactor_EmissionDecayRate$
	}
}
