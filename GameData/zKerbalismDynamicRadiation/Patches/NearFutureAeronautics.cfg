// Dynamic radiation source for Near Future Aeronautics nuclear air engines.
// DynamicRadiationController is added by SystemHeatFissionEngines.cfg; these
// emitters provide the peak radiation that controller scales at runtime.
@PART[nfa-atomic-jet-25-1]:HAS[@MODULE[SystemHeatFissionEngineKerbalismUpdater],!MODULE[Emitter]]:NEEDS[NearFutureAeronautics,Kerbalism,FeatureRadiation,zKerbalismBridge,zKerbalismNative]:FOR[zzzzzzz_KerbalismDynamicRadiation]
{
	MODULE
	{
		name = Emitter
		radiation = 0.00083331 // rad/s - open-cycle nuclear airbreather, comparable to SXT nuclear ramjet.
	}
}

@PART[nfa-atomic-multimode-25-1]:HAS[@MODULE[SystemHeatFissionEngineKerbalismUpdater],!MODULE[Emitter]]:NEEDS[NearFutureAeronautics,Kerbalism,FeatureRadiation,zKerbalismBridge,zKerbalismNative]:FOR[zzzzzzz_KerbalismDynamicRadiation]
{
	MODULE
	{
		name = Emitter
		radiation = 0.00069444 // rad/s - large multimode nuclear engine.
	}
}
