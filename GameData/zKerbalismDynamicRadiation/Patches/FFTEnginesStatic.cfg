// FFT engines that only have static Emitter from zKerbalismFFT (no FFTFusionEngineKerbalismUpdater).
// Radiation scales with engine thrust; idle = minimum %, firing = full, after shutdown = decay.
@PART[fft-*]:HAS[@MODULE[Emitter]:HAS[#radiation[>0]],@MODULE[ModuleEngines*],!MODULE[FFTFusionEngineKerbalismUpdater]]:NEEDS[Kerbalism,FeatureRadiation,zKerbalismFFT,FarFutureTechnologies]:FOR[zzzzzzz_KerbalismDynamicRadiation]
{
	MODULE
	{
		name = DynamicRadiationController
		powerModuleName = ModuleEngines
		powerActiveMode = thrust
		minEmissionPercent = #$@KERBALISM_DYNAMIC_RADIATION_SETTINGS/Engine_MinEmissionPercent$
		emissionDecayRate = #$@KERBALISM_DYNAMIC_RADIATION_SETTINGS/Engine_EmissionDecayRate$
	}
}
