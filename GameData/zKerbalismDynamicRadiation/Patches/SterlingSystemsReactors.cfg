// Dynamic radiation for Sterling fission reactors on Kerbalism + SystemHeat path.
@PART[strl-rctrms-*|strl-rctrpb-*]:HAS[@MODULE[Emitter]:HAS[#radiation[>0]],@MODULE[ProcessControllerSystemHeat]]:NEEDS[Kerbalism,FeatureRadiation,SterlingSystems,SterlingSystemsKerbalism,zKerbalismBridge,zKerbalismProcess,zKerbalismNative]:FOR[zzzzzzz_KerbalismDynamicRadiation]
{
	MODULE
	{
		name = DynamicRadiationController
		powerModuleName = ProcessControllerSystemHeat
		powerActiveMode = any_running
		minEmissionPercent = #$@KERBALISM_DYNAMIC_RADIATION_SETTINGS/Reactor_MinEmissionPercent$
		emissionDecayRate = #$@KERBALISM_DYNAMIC_RADIATION_SETTINGS/Reactor_EmissionDecayRate$
	}
}
